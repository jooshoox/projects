# Content Analysis Configuration

# Language settings
languages:
  default: en
  supported:
    - en    # English
    - es    # Spanish
    - fr    # French
    - de    # German

# Analysis thresholds
thresholds:
  minimum_confidence: 0.6
  minimum_keyword_frequency: 2
  maximum_file_size_mb: 50
  
# Tag definitions and weights
tags:
  technical:
    weight: 1.2
    keywords:
      - programming
      - software
      - development
      - code
      - technical
      - documentation
      - algorithm
      - framework
      - implementation
      - architecture
    minimum_confidence: 0.7
    
  financial:
    weight: 1.5
    keywords:
      - finance
      - budget
      - investment
      - accounting
      - revenue
      - expense
      - profit
      - loss
      - dividend
      - asset
      - liability
    minimum_confidence: 0.8
    
  legal:
    weight: 1.4
    keywords:
      - legal
      - contract
      - agreement
      - terms
      - conditions
      - compliance
      - regulation
      - jurisdiction
      - obligation
      - liability
      - clause
    minimum_confidence: 0.75
    
  research:
    weight: 1.3
    keywords:
      - research
      - study
      - analysis
      - methodology
      - findings
      - conclusion
      - experiment
      - hypothesis
      - data
      - results
      - investigation
    minimum_confidence: 0.65

# Processing options
processing:
  enable_caching: true
  cache_duration_days: 30
  parallel_processing: true
  max_workers: 4
  create_symlinks: true

# File handling
file_handling:
  unclassified_folder: Unclassified
  skip_binary_files: true
  retry_failed: true
  max_retries: 3

# File Organizer Configuration

# Define custom categories and their file extensions
categories:
  documents:
    - .pdf
    - .doc
    - .docx
    - .txt
    - .rtf
    - .odt
    - .md
  
  images:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .bmp
    - .svg
    - .webp
  
  audio:
    - .mp3
    - .wav
    - .flac
    - .m4a
    - .ogg
  
  video:
    - .mp4
    - .avi
    - .mkv
    - .mov
    - .wmv
  
  archives:
    - .zip
    - .rar
    - .7z
    - .tar
    - .gz
  
  code:
    - .py
    - .js
    - .java
    - .cpp
    - .h
    - .css
    - .html

# Content Analysis Configuration
content_analysis:
  # Language settings
  languages:
    default: en
    supported:
      - en    # English
      - es    # Spanish
      - fr    # French
      - de    # German
  
  # Analysis thresholds
  thresholds:
    minimum_confidence: 0.6
    minimum_keyword_frequency: 2
    maximum_file_size_mb: 50
  
  # Tag definitions and weights
  tags:
    technical:
      weight: 1.2
      keywords:
        - programming
        - software
        - development
        - code
        - technical
        - documentation
      minimum_confidence: 0.7
    
    financial:
      weight: 1.5
      keywords:
        - finance
        - budget
        - investment
        - accounting
        - revenue
        - expense
      minimum_confidence: 0.8
    
    research:
      weight: 1.3
      keywords:
        - research
        - study
        - analysis
        - methodology
        - findings
        - conclusion
      minimum_confidence: 0.65
    
    legal:
      weight: 1.4
      keywords:
        - legal
        - contract
        - agreement
        - terms
        - conditions
        - compliance
      minimum_confidence: 0.85
  
  # Processing options
  processing:
    enable_caching: true
    cache_duration_days: 30
    parallel_processing: true
    max_workers: 4
    create_symlinks: true
  
  # File handling
  file_handling:
    unclassified_folder: Unclassified
    skip_binary_files: true
    retry_failed: true
    max_retries: 3

# General settings
settings:
  create_missing_dirs: true
  dry_run: false
  minimum_file_size: 0  # in bytes
  ignore_older_than: 0   # in days (0 to process all files)
  move_files: true       # false for copy instead of move
